<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LINEアイコン画像の生成｜ドロッパー</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --teal:#06b6a4; --teal-d:#048b7f; --ink:#0f3d3a; --sub:#4f7c78; --line:#cdeae6; }
    * { box-sizing:border-box; }
    body { font-family:'Zen Maru Gothic',Meiryo,sans-serif; font-weight:500; color:var(--ink);
      margin:0; line-height:1.6; background:#f4fbf9; }
    .wrap { max-width:900px; margin:0 auto; padding:24px 16px 60px; }
    h1 { font-family:'Mochiy Pop One',sans-serif; font-weight:400; font-size:21px;
      color:var(--teal-d); margin:0 0 6px; }
    .lead { margin:0 0 18px; font-size:13px; color:var(--sub); }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; margin:0 0 16px; }
    .card h2 { font-size:15px; color:var(--teal-d); margin:0 0 10px; }
    .views { display:flex; gap:24px; align-items:flex-end; flex-wrap:wrap; }
    .views figure { margin:0; text-align:center; font-size:12px; color:var(--sub); }
    .views img { display:block; margin:0 auto 6px; }
    .sq { width:240px; height:240px; border:1px solid var(--line); }
    .round { width:240px; height:240px; border-radius:50%; }
    .small { width:48px; height:48px; border-radius:50%; }
    button { font-family:inherit; font-size:15px; font-weight:700; padding:12px 22px; border:none;
      border-radius:12px; cursor:pointer; color:#fff;
      background:linear-gradient(100deg,var(--teal),var(--teal-d)); }
    button:disabled { opacity:.5; cursor:default; }
    .note { font-size:12.5px; color:var(--sub); line-height:1.9; margin:10px 0 0; }
    .note b { color:var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>LINEアイコン画像の生成</h1>
    <p class="lead">LINE公式アカウントのプロフィール画像（640×640px）を作ります。このページはLINEからは辿れません。</p>

    <div class="card">
      <h2>見え方</h2>
      <div class="views">
        <figure><img id="vSquare" class="sq" alt="正方形のまま"><figcaption>できる画像（正方形）</figcaption></figure>
        <figure><img id="vRound" class="round" alt="丸く切り抜いた形"><figcaption>LINEで丸く切り抜かれた形</figcaption></figure>
        <figure><img id="vSmall" class="small" alt="小さく出たとき"><figcaption>友だち一覧くらい</figcaption></figure>
      </div>
      <p class="note" id="status">描画しています…</p>
      <p><button type="button" id="dl" disabled>PNGをダウンロード</button></p>
    </div>

    <div class="card">
      <h2>差し替えかた</h2>
      <p class="note">
        LINE公式アカウントマネージャー → 設定 → アカウント設定 → <b>プロフィール画像</b> で、落とした PNG を選びます。<br>
        LINE が<b>丸く切り抜く</b>ので、四隅は背景の青で埋めてあります（切り抜かれても欠けない）。<br>
        <b>プロフィール画像は、変えてから1時間は変えられません。</b>選ぶ前に、上の「丸く切り抜いた形」で確かめてください。
      </p>
    </div>
  </div>

  <script>
    // ===== LINEアイコン（2026-09-24、本人が選んだ S3） =====
    // 青地に白い書類と白い矢印が、金の優勝カップへ落ちる。まわりに光の筋・きらめき・紙ふぶき。
    // 絵は SVG で組み、画像にしてからキャンバスに写して PNG にする（外の画像や文字は使わないので汚れない）。
    // 大きさと決まりは LINE の推奨どおり：640×640px・JPG/PNG・3MB以下。保存すると1時間は変えられない
    //   （https://ligla.jp/blog/line-official/image-2/ ・ https://www.sharecoto.co.jp/linelab/profile-picture-size 、2026-09-24 に確認）
    // ★ 座標は円の中心を (0,0)、半径95 の世界で書いてある（候補を比べたときの絵と同じ数字）。
    //   画像は正方形いっぱいに描く。LINE が丸く切り抜くので、四隅も背景色で埋める
    var SIZE = 640;
    var BLUE = '#1d4ed8';

    function f1(n) { return n.toFixed(1); }
    function star(x, y, s, fill) {
      var k = s * 0.26;
      return '<polygon fill="' + fill + '" points="' + [[0, -s], [k, -k], [s, 0], [k, k], [0, s], [-k, k], [-s, 0], [-k, -k]]
        .map(function (q) { return f1(x + q[0]) + ',' + f1(y + q[1]); }).join(' ') + '"/>';
    }
    function rays() {
      var out = [], n = 14, cy = 28, R = 160, half = 0.11;
      for (var i = 0; i < n; i++) {
        var a = (2 * Math.PI / n) * i;
        out.push('<polygon fill="#3b82f6" points="0,' + cy + ' ' +
          f1(R * Math.sin(a - half)) + ',' + f1(cy - R * Math.cos(a - half)) + ' ' +
          f1(R * Math.sin(a + half)) + ',' + f1(cy - R * Math.cos(a + half)) + '"/>');
      }
      return '<g clip-path="url(#sq)">' + out.join('') + '</g>';
    }
    function sparkles() {
      var S = function (x, y, s, c) { return star(x, y, s * 1.3, c); };
      return S(-58, -4, 14, '#fde047') + S(58, -14, 12, '#ffffff') + S(54, 40, 9, '#fde047') + S(-50, 50, 8, '#ffffff') +
        S(-42, -46, 7, '#ffffff') + S(42, -50, 9, '#fde047') + S(-67, 24, 6, '#fde047') + S(68, 16, 6, '#ffffff') +
        S(21, 22, 6, '#ffffff');
    }
    function confetti() {
      return [[-74, -22, 3, '#fde047'], [75, -32, 3, '#ffffff'], [28, -80, 2.5, '#fde047'], [-32, -78, 2.5, '#ffffff'],
        [-62, 70, 3, '#fde047'], [62, 66, 3, '#ffffff'], [0, 86, 2.5, '#fde047'], [-80, 44, 2.5, '#ffffff'], [82, 42, 2.5, '#fde047']]
        .map(function (d) { return '<circle cx="' + d[0] + '" cy="' + d[1] + '" r="' + d[2] + '" fill="' + d[3] + '"/>'; }).join('');
    }
    function svgText() {
      return '<svg xmlns="http://www.w3.org/2000/svg" width="' + SIZE + '" height="' + SIZE + '" viewBox="-95 -95 190 190">' +
        '<defs><clipPath id="sq"><rect x="-95" y="-95" width="190" height="190"/></clipPath></defs>' +
        '<rect x="-95" y="-95" width="190" height="190" fill="' + BLUE + '"/>' +
        rays() +
        // 書類と矢印
        '<rect x="-20" y="-80" width="40" height="48" rx="5" fill="#ffffff"/>' +
        '<rect x="-13" y="-69" width="26" height="4.5" rx="2" fill="' + BLUE + '"/>' +
        '<rect x="-13" y="-59" width="26" height="4.5" rx="2" fill="' + BLUE + '"/>' +
        '<rect x="-13" y="-49" width="16" height="4.5" rx="2" fill="' + BLUE + '"/>' +
        '<rect x="-6" y="-26" width="12" height="14" fill="#ffffff"/><polygon points="-16,-13 16,-13 0,4" fill="#ffffff"/>' +
        // 優勝カップ
        '<path d="M-30 16 C-47 16 -47 37 -25 39 M30 16 C47 16 47 37 25 39" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>' +
        '<path d="M-30 10 H30 V18 C30 36 18 46 0 46 C-18 46 -30 36 -30 18 Z" fill="#fbbf24"/>' +
        '<rect x="-30" y="10" width="60" height="6" fill="#f59e0b"/>' +
        '<rect x="-5" y="45" width="10" height="12" fill="#fbbf24"/><rect x="-20" y="56" width="40" height="9" rx="2" fill="#f59e0b"/>' +
        '<rect x="-26" y="64" width="52" height="8" rx="2" fill="#d97706"/>' +
        '<rect x="-22" y="19" width="7" height="19" rx="3" fill="#fef3c7"/>' +
        sparkles() + confetti() +
        '</svg>';
    }

    (function () {
      var st = document.getElementById('status');
      var btn = document.getElementById('dl');
      var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText());
      ['vSquare', 'vRound', 'vSmall'].forEach(function (id) { document.getElementById(id).src = url; });

      var img = new Image();
      img.onload = function () {
        var cv = document.createElement('canvas');
        cv.width = SIZE; cv.height = SIZE;
        cv.getContext('2d').drawImage(img, 0, 0, SIZE, SIZE);
        st.textContent = SIZE + ' × ' + SIZE + ' px で描画しました。';
        btn.disabled = false;
        btn.addEventListener('click', function () {
          cv.toBlob(function (blob) {
            if (!blob) { st.textContent = '画像を作れませんでした。'; return; }
            var u = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = u; a.download = 'dropper-line-icon-640.png';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
            st.textContent = 'ダウンロードしました（' + Math.round(blob.size / 1024) + ' KB）。';
          }, 'image/png');
        });
      };
      img.onerror = function () { st.textContent = '画像を作れませんでした。'; };
      img.src = url;
    })();
  </script>
</body>
</html>
